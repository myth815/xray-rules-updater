# Include inside the private rules server, alongside its current-version routes.
# Server-level LAN/WireGuard allow/deny directives remain inherited here.
# Only these two immutable DAT names are served; no directory listing, config,
# hidden stage or arbitrary publication file is reachable through this route.
location ~ "^/versions/(?<rules_asset_version>[A-Za-z0-9][A-Za-z0-9._-]{0,63})/(?<rules_asset_file>geoip[.]dat|geosite[.]dat)$" {
    alias /rules/versions/$rules_asset_version/$rules_asset_file;
    disable_symlinks on from=/rules/versions;
    default_type application/octet-stream;
    autoindex off;
    log_not_found off;
    access_log off;

    # A retained version can differ from the server's current rules_version.
    add_header X-Rules-Version $rules_asset_version always;
    add_header Cache-Control "private, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}
